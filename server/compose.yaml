services:
  servidor:
    build: .
    # La misma etiqueta que lleva la imagen publicada; con IMAGEN se apunta a
    # un registro (IMAGEN=xinux87/mcp-tareas-server:0.1.6, en Docker Hub) y
    # `docker compose pull` la trae sin construir.
    image: ${IMAGEN:-mcp-tareas-server:0.1.0}
    # Dentro del contenedor siempre escucha en 3000, que es lo que comprueba el
    # HEALTHCHECK de la imagen. Fuera se publica en PORT, que en local es 9917.
    ports:
      - "${PORT:-9917}:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - BASE_URL=${BASE_URL:-http://localhost:9917}
      - SESSION_SECRET=${SESSION_SECRET:?falta SESSION_SECRET, está en server/.env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?falta ADMIN_PASSWORD, solo se usa en el primer arranque}
      # Sin valor: se pasa solo si está definida. Dentro de Docker las
      # interfaces que detecta el proceso son las del contenedor, no las del
      # anfitrión, así que las direcciones de red se declaran aquí.
      - DIRECCIONES
      # Igual: sin valor por defecto. Si está, cada aviso va por POST ahí.
      - AVISOS_URL
      # Horas que una fase puede llevar en marcha antes de salir como parada.
      - FASE_PARADA_HORAS=${FASE_PARADA_HORAS:-6}
    volumes:
      # Sin DATOS, el volumen `datos` de Docker; con DATOS=/ruta, esa carpeta
      # del anfitrión (tiene que poder escribirla el uid 1000).
      - ${DATOS:-datos}:/data
    restart: unless-stopped

volumes:
  datos:
