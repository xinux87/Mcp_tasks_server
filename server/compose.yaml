services:
  servidor:
    build: .
    image: mcp-tareas-server
    ports:
      - "3000:3000"
    environment:
      # Valores de ejemplo; los secretos son obligatorios y no tienen defecto.
      PORT: "3000"
      DATA_DIR: /data
      BASE_URL: "${BASE_URL:-http://localhost:3000}"
      SESSION_SECRET: "${SESSION_SECRET:?falta SESSION_SECRET}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?falta ADMIN_PASSWORD, solo se usa en el primer arranque}"
    volumes:
      - datos:/data
    restart: unless-stopped

volumes:
  datos:
